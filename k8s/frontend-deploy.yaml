apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-frontend
  namespace: k3s-cicd-play
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-frontend
  template:
    metadata:
      labels:
        app: shopping-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-key
      containers:
        - name: frontend
          image: mattvarghesedocker/k3s-cicd-play-frontend:v4   # v1 doesn't have DELETE support, v3 adds keycloak
          ports:
            - containerPort: 80 # Nginx listens here
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: k3s-cicd-play
spec:
  type: NodePort
  selector:
    app: shopping-frontend
  ports:
    - protocol: TCP
      port: 80          # Service port
      targetPort: 80    # Nginx port
      nodePort: 30001   # Accessible at http://<k3s-node-ip>:30001
