apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: k3s-cicd-play
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-db
  namespace: k3s-cicd-play
spec:
  strategy:
    type: Recreate # Ensures only one pod tries to write to the PVC at a time
  selector:
    matchLabels:
      app: shopping-db
  template:
    metadata:
      labels:
        app: shopping-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "shopping_db"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgredb
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d # This is where Postgres looks for SQL
      volumes:
        - name: postgredb
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-sql  # Kustomize will generate this name
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-db
  namespace: k3s-cicd-play
spec:
  selector:
    app: shopping-db
  ports:
    - port: 5432
      targetPort: 5432
