server {
    listen 8081;
    server_name localhost;

    # 1. Serve the Static Frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Backend container (same pod)
    location /api/ {
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        
        # Standard Proxy Headers
        proxy_set_header Host localhost:8082;
        proxy_set_header Origin http://localhost:8082;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Crucial for live data)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
