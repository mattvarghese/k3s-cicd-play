# ------------------------------------------------------------------------------
# K10s AUTHENTICATION SECRETS
# NOTE: For a real production deployment, these should NEVER be in the codebase.
# They would be managed via a Secret Manager, SealedSecrets, or manual injection.
# For this k3s-cicd-play playground, we include them here for automation.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: k10s-secret-user
  namespace: k10s-gui
type: Opaque
stringData:
  USERNAME: admin
  PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: k10s-secret-jwt
  namespace: k10s-gui
type: Opaque
stringData:
  # In production, this would be a long random string
  JWT_SECRET: "ArtistPlaygroundSecret123"
---
# ------------------------------------------------------------------------------
# K10s DEPLOYMENT
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k10s
  namespace: k10s-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k10s
  template:
    metadata:
      labels:
        app: k10s
    spec:
      serviceAccountName: k10s-viewer
      containers:
        - name: frontend
          image: ghcr.io/eliasdehondt/k10s-frontend:latest
          ports:
            - containerPort: 8081
          env:
            - name: BACKEND_URL
              value: "http://localhost:30003"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: backend
          image: ghcr.io/eliasdehondt/k10s-backend:latest
          env:
            - name: USERNAME
              valueFrom: { secretKeyRef: { name: k10s-secret-user, key: USERNAME } }
            - name: PASSWORD
              valueFrom: { secretKeyRef: { name: k10s-secret-user, key: PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: k10s-secret-jwt, key: JWT_SECRET } }
      volumes:
        - name: nginx-config
          configMap:
            name: k10s-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: k10s-service
  namespace: k10s-gui
spec:
  type: NodePort
  selector:
    app: k10s
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
      nodePort: 30003
